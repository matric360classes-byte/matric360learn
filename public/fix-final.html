**1. Difference of Squares**
Formula: a² - b² = (a-b)(a+b)
Example: x² - 9 = (x-3)(x+3)

**2. Perfect Square Trinomial**
Formula: (a+b)² = a² + 2ab + b²
Formula: (a-b)² = a² - 2ab + b²
Example: (x+2)² = x² +4x+4

**3. Sum and Difference of Cubes**
Formula: a³ - b³ = (a-b)(a²+ab+b²)
Formula: a³ + b³ = (a+b)(a²-ab+b²)

**4. Common Factor & Grouping**
Formula: ab+ac = a(b+c)
Example: 2x+4 = 2(x+2)
`
